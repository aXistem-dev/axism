name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write  # Trusted Publisher (OIDC) → PyPI
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Python
        run: uv python install 3.12

      - name: Check tag matches project version
        run: |
          python3 - "${GITHUB_REF_NAME}" <<'PY'
          import re
          import sys
          import tomllib

          tag = sys.argv[1].removeprefix("v")
          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]["version"]
          with open("src/axism/__init__.py", encoding="utf-8") as fh:
              match = re.search(r'^__version__\s*=\s*"([^"]+)"', fh.read(), re.M)
          package = match.group(1) if match else None
          errors = []
          if tag != project:
              errors.append(f"tag {tag} does not match project.version {project} in pyproject.toml")
          if tag != package:
              errors.append(f"tag {tag} does not match __version__ {package} in src/axism/__init__.py")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY

      # Fails the release when CHANGELOG.md has no section for this version.
      # Written outside dist/ so it is never uploaded to PyPI.
      - name: Release notes from CHANGELOG
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/RELEASE_NOTES.md"

      - name: Test
        run: |
          uv sync --extra dev
          uv run pytest -q
          uv run ruff check src tests
          python3 scripts/check_anonymity.py

      - name: Build
        run: |
          uv build
          ls -la dist

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Creates the PyPI project on first successful upload when a
      # pending Trusted Publisher is registered for this workflow.
      # See: https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
